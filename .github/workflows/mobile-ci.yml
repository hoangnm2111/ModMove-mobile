name: Mobile CI Pipeline (Flutter / Android)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  flutter-analyze-test:
    name: Flutter Analyze, Test & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: đŸ“¥ Checkout Repository
        uses: actions/checkout@v4

      - name: â˜• Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: đŸ’™ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: đŸ“¦ Install Flutter Dependencies
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
          else
            echo "â„¹ï¸ pubspec.yaml not yet committed. Ready for code push."
          fi

      - name: đŸ” Static Code Analysis (Flutter Analyze)
        run: |
          if [ -f pubspec.yaml ]; then
            flutter analyze --no-fatal-infos
          else
            echo "â„¹ï¸ Flutter project not yet initialized. Analyzer ready."
          fi

      - name: đŸ§ª Run Unit & Widget Tests
        run: |
          if [ -d test ]; then
            flutter test --coverage
          else
            echo "â„¹ï¸ Tests directory not yet committed. Test runner ready."
          fi

      - name: đŸ“± Build Android Debug APK
        run: |
          if [ -f pubspec.yaml ] && [ -d android ]; then
            flutter build apk --debug
          else
            echo "â„¹ï¸ Android build configuration not yet committed. APK builder ready."
          fi