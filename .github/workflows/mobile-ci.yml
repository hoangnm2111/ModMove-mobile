name: Mobile CI Pipeline (Flutter / Android)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

jobs:
  flutter-analyze-test:
    name: Flutter Analyze, Test & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
          else
            echo "pubspec.yaml not committed yet. Environment check OK."
          fi

      - name: Static Code Analysis (Flutter Analyze)
        run: |
          if [ -f pubspec.yaml ]; then
            flutter analyze --no-fatal-infos
          else
            echo "Flutter project not initialized yet. Analyzer ready."
          fi

      - name: Run Unit & Widget Tests
        run: |
          if [ -d test ]; then
            flutter test --coverage
          else
            echo "Tests directory not committed yet. Test runner ready."
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f pubspec.yaml ] && [ -d android ]; then
            flutter build apk --debug
          else
            echo "Android build files not committed yet. APK builder ready."
          fi