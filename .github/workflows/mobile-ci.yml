name: Mobile CI Pipeline (Flutter / Android)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  flutter-analyze-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: đŸ“¥ Checkout Repository
        uses: actions/checkout@v4

      - name: â˜• Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: đŸ’™ Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: đŸ“¦ Install Flutter Dependencies
        run: |
          if [ -f pubspec.yaml ]; then
            flutter pub get
          else
            echo "â„¹ï¸ No pubspec.yaml found yet. Skipping pub get."
          fi

      - name: đŸ” Static Code Analysis (Flutter Analyze)
        run: |
          if [ -f pubspec.yaml ]; then
            flutter analyze --no-fatal-infos
          else
            echo "â„¹ï¸ Flutter project not yet initialized. Skipping analyze."
          fi

      - name: đŸ§ª Run Unit & Widget Tests
        run: |
          if [ -d test ] && [ "\" ]; then
            flutter test --coverage
          else
            echo "â„¹ï¸ No test directory committed yet. Skipping tests."
          fi

      - name: đŸ“± Build Android Debug APK
        run: |
          if [ -f pubspec.yaml ] && [ -d android ]; then
            flutter build apk --debug
          else
            echo "â„¹ï¸ Android build files not committed yet. Skipping APK build."
          fi